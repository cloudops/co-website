[build]
publish = "public"
command = "hugo --gc --minify -b https://www.cloudops.com"

[context.production.environment]
HUGO_VERSION = "0.74.3"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.74.3"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.74.3"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.74.3"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

# ============================================================================
# CloudOps -> Aptum 301 redirects (cloudops.com retirement)
# ----------------------------------------------------------------------------
# Netlify processes these TOP-TO-BOTTOM, FIRST MATCH WINS. Order is deliberate:
#   specific paths first, then wildcards, then (eventually) the global catch-all.
# force = true on every rule: Hugo still builds these pages into public/, so
#   without force Netlify would serve the file and the redirect would not fire.
# ?ref=cloudops is the PROVISIONAL banner signal for aptum.com. Confirm the
#   parameter name with Double Up; changing it is one find/replace.
# Rollout batches (see cloudops-aptum-redirect-map-updated.xlsx):
#   A = specific 1:1 rules (THIS commit)   B = EN wildcards   C = French
#   CloudMC is a SEPARATE host (cloudmc.cloudops.com) and is NOT handled here.
#   The global /* -> / catch-all is intentionally NOT enabled yet -- it would
#   force-redirect every asset and break any still-serving section. It goes in
#   last, at full retirement.
# ============================================================================

# ===== BATCH A -- bespoke EN (specific 1:1) =====
